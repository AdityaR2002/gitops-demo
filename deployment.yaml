apiVersion: apps/v1
kind: Deployment
metadata:
  name: podinfo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: podinfo
  template:
    metadata:
      labels:
        app: podinfo
    spec:
      containers:
      - name: podinfo
        image: nginx:stable
        ports:
        - containerPort: 80
        env:
        - name: DEMO_MESSAGE
          valueFrom:
            secretKeyRef:
              name: demo-secret
              key: ui-message
